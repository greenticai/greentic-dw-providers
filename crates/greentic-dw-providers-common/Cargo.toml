[package]
name = "greentic-dw-providers-common"
version.workspace = true
edition.workspace = true
rust-version = "1.94"
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Shared support crate for Greentic DW provider scaffolding."

[features]
# Emit the `PackManifest.agents` field. Enable when building against a
# greentic-types revision that has it (e.g. the rev greentic-runner pins for the
# long-term-memory integration). Off by default so this crate also builds
# against the published greentic-types that lacks the field.
default = ["pack-manifest-agents"]
pack-manifest-agents = []

[dependencies]
greentic-dw-embedding = { workspace = true }
greentic-dw-llm = { workspace = true }
greentic-cap-types = { workspace = true }
greentic-types = { workspace = true }
greentic-interfaces = { workspace = true }
greentic-pack = { workspace = true }
greentic-state = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
greentic-dw-llm-anthropic = { path = "../../llm/anthropic" }
greentic-dw-llm-azure-openai = { path = "../../llm/azure-openai" }
greentic-dw-llm-bedrock = { path = "../../llm/bedrock" }
greentic-dw-llm-gemini = { path = "../../llm/gemini" }
greentic-dw-llm-nvidia-nim = { path = "../../llm/nvidia-nim" }
greentic-dw-llm-openai = { path = "../../llm/openai" }
greentic-dw-llm-openai-compatible = { path = "../../llm/openai-compatible" }
serde_json = { workspace = true }
