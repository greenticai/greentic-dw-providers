name: Reusable Coverage Check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      # --locked is required: when binstall cannot reach the prebuilt-binary
      # fetchers (GitHub API timeouts / rate limits) it falls back to building
      # from source, and cargo-nextest refuses a source install without it.
      # GITHUB_TOKEN raises the API rate limit so the fallback is rarely needed.
      - name: Install coverage tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo binstall --no-confirm --force --locked greentic-dev cargo-nextest cargo-llvm-cov

      - name: Run coverage policy check
        run: greentic-dev coverage
