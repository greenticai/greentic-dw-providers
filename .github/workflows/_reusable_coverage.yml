name: Reusable Coverage Check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      # --disable-strategies compile makes a failed prebuilt-binary fetch a hard
      # error instead of a silent ~11 min source rebuild. When api.github.com
      # answers 403 (anonymous rate limit or a transient block) binstall does not
      # fail: it quietly degrades to compiling from source, which hides the real
      # problem behind a slow-but-green job. All three tools publish prebuilt
      # binaries, so there is no legitimate reason to ever compile them here.
      # --locked is kept so a source install would still be reproducible, and
      # GITHUB_TOKEN raises the API rate limit so the 403 is rare to begin with.
      # The command -v checks assert the binaries actually landed on PATH.
      # The download is retried (3 attempts, 20s then 40s backoff) because GitHub
      # release downloads occasionally fail with transient network errors, and
      # with compile disabled a single flake would fail the job before any test.
      - name: Install coverage tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          attempt=1
          until cargo binstall --no-confirm --force --locked --disable-strategies compile \
            greentic-dev cargo-nextest cargo-llvm-cov; do
            status=$?
            if [ "$attempt" -ge 3 ]; then
              echo "cargo binstall failed after $attempt attempts" >&2
              exit "$status"
            fi
            delay=$((attempt * 20))
            echo "cargo binstall failed (exit $status); retrying in ${delay}s" >&2
            sleep "$delay"
            attempt=$((attempt + 1))
          done
          command -v greentic-dev
          command -v cargo-nextest
          command -v cargo-llvm-cov

      - name: Run coverage policy check
        run: greentic-dev coverage
