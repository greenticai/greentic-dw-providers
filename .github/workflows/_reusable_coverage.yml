name: Reusable Coverage Check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Configure git auth for private chronicle dep
        run: |
          git config --global url."https://x-access-token:${{ secrets.CHRONICLE_REPO_TOKEN }}@github.com/greentic-biz/greentic-chronicle-ext".insteadOf "https://github.com/greentic-biz/greentic-chronicle-ext"

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install coverage tools
        run: cargo binstall --no-confirm --force greentic-dev cargo-nextest cargo-llvm-cov

      - name: Run coverage policy check
        run: greentic-dev coverage
