name: Perf (lightweight)
# Nightly-only. See plans/binary-bifurcation.md Phase A.8: push-trigger removed
# because post-merge perf runs were burning 15+ min without actionable signal.

on:
  schedule:
    - cron: "38 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -C debuginfo=0
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Configure git auth for private chronicle dep
        run: |
          git config --global url."https://x-access-token:${{ secrets.CHRONICLE_REPO_TOKEN }}@github.com/greentic-biz/greentic-chronicle-ext".insteadOf "https://github.com/greentic-biz/greentic-chronicle-ext"

      - name: Run perf guard tests
        run: cargo test -p greentic-dw-providers --test perf_timeout --test perf_scaling

      - name: Run benchmarks (smoke)
        run: cargo bench -p greentic-dw-providers --bench perf -- --sample-size 10
