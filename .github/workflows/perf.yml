name: Perf (lightweight)
# Moved off pull_request onto a nightly schedule. See plans/binary-bifurcation.md
# Phase A (heavy-job sweep). Manual runs remain via workflow_dispatch. push
# trigger preserved so main-merge still catches regressions immediately.

on:
  schedule:
    - cron: "38 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -C debuginfo=0
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run perf guard tests
        run: cargo test -p greentic-dw-providers --test perf_timeout --test perf_scaling

      - name: Run benchmarks (smoke)
        run: cargo bench -p greentic-dw-providers --bench perf -- --sample-size 10
