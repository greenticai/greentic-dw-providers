# Scoped publish of greentic-dw-memory-long-term only (aw-runtime dep).
name: Publish memory-long-term to crates.io
on:
  push:
    tags: ["mlt-v*"]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    uses: greenticai/.github/.github/workflows/crates-publish.yml@main
    with:
      crates: "greentic-dw-memory-long-term"
    secrets: inherit
